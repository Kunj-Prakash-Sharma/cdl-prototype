name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Server code validates env at import, so builds need a (fake) .env.
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run build:worker

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    # Same credentials and port as docker-compose.yml, so .env.example works unchanged. The e2e global setup
    # creates and migrates the `self_test` database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: self
          POSTGRES_PASSWORD: self
          POSTGRES_DB: self
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U self -d self"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      # Build only (no push): proves the container image the app deploys from still builds.
      - run: docker build -t self-app:ci .
