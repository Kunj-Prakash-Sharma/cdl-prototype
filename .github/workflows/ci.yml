name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Server code validates env at import, so builds need a (fake) .env.
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run build:worker

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      # Build only (no push): proves the container image the app deploys from still builds.
      - run: docker build -t self-app:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Known-vulnerable dependencies (production only; fail on high or critical).
      - run: npm audit --omit=dev --audit-level=high
      # Secrets committed by mistake.
      - uses: trufflesecurity/trufflehog@v3.88.0
        with:
          extra_args: --results=verified,unknown
      # Insecure code patterns (injection, XSS, weak crypto, ...).
      - run: pip install semgrep==1.100.0
      - run: semgrep scan --config p/typescript --config p/owasp-top-ten --error --exclude node_modules --exclude .next
