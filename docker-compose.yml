# Local dev database. Same major version as the managed RDS Postgres.
# Host port defaults to 5433 so it does not clash with a Postgres already running on 5432.
# If 5433 is taken too, set DB_PORT in your .env (compose reads it) and use the same port in DATABASE_URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-self}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env (sets POSTGRES_PASSWORD)}
      POSTGRES_DB: ${POSTGRES_DB:-self}
    ports:
      # Loopback only: the dev password is weak, so the database must not be reachable from the network.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - self-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: self-app:local
    build: .
    command: ["sh", "-c", "cd /worker && node dist/migrate.js"]
    environment: &app-env # Local only: fake adapters (SMS, email, ...) are refused when NODE_ENV=production.
      NODE_ENV: development
      # Local only: Next standalone forces NODE_ENV=production for the web; this phase flag exempts it from the same guard.
      NEXT_PHASE: phase-production-build
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-self}:${POSTGRES_PASSWORD:?Copy .env.example to .env}@db:5432/${POSTGRES_DB:-self}
      AUTH_SECRET: dev-only-secret-change-me-0123456789abcdef
      TURNSTILE_SITE_KEY: 1x00000000000000000000BB
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      CALLBACK_ALERT_EMAIL: team@example.com
    depends_on:
      db:
        condition: service_healthy

  app:
    image: self-app:local
    environment: *app-env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: self-app:local
    command: ["node", "/worker/dist/worker.js"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  self-db:
