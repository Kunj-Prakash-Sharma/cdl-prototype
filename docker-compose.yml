# Local dev database. Same major version as the managed RDS Postgres.
# Host port is 5433 so it does not clash with a Postgres already running on 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: self
      POSTGRES_PASSWORD: self
      POSTGRES_DB: self
    ports:
      - "5433:5432"
    volumes:
      - self-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U self -d self"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  self-db:
